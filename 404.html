    <script>
      (() => {
        try {
          // Only the document language is applied here. The dashboard theme and the
          // brand colour chosen in the settings are scoped to the dashboard shell so
          // the public pages (landing, auth, plans) always stay on the light brand look.
          // The state file is namespaced per session (see src/data/session.js), so the
          // right shop is read before the bundle is even parsed. The unsuffixed key is
          // the historical one and belongs to the anonymous session.
          const session = JSON.parse(localStorage.getItem('hexagone.session') || 'null');
          const scope = (session && (session.workspaceId || session.id)) || 'default';
          const raw = localStorage.getItem(`hexagone.state:${scope}`) || localStorage.getItem('hexagone.state');
          const settings = raw ? JSON.parse(raw).settings : null;
          const language = settings && settings.language ? settings.language : 'fr';
          document.documentElement.lang = language;
          document.documentElement.dir = language === 'ar' ? 'rtl' : 'ltr';
        } catch {}
      })()
    </script>
